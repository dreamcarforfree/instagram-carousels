<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build Your A-Team</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --bg: #FAFCFF;
    --bg-elevated: #FFFFFF;
    --bg-card: #FFFFFF;

    --text-primary: #111827;
    --text-secondary: #374151;
    --text-tertiary: #6B7280;

    --accent: #005BFF;
    --accent-2: #00D2FF;
    --accent-soft: #005BFF;
    --accent-bg: rgba(0, 91, 255, 0.04);
    --accent-border: rgba(0, 91, 255, 0.12);
    --accent-strong: rgba(0, 91, 255, 0.08);

    --card-border: rgba(0, 91, 255, 0.08);
    --card-border-strong: rgba(0, 91, 255, 0.15);
  }

  .card-header-left .brand-dot {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .card-header-left .label {
    color: var(--text-primary);
  }

  .glow {
    position: absolute;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .glow.tr {
    top: -260px; right: -220px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  }
  .glow.bl {
    bottom: -300px; left: -240px;
    background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
  }

  .cta-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cta-title { font-size: 84px; font-weight: 900; line-height: 1.1; letter-spacing: -0.035em; color: var(--text-primary); }
  .cta-sub { font-size: 32px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.5; }
  
  .follow-btn {
    margin-top: 68px; display: inline-block; padding: 30px 76px;
    background: linear-gradient(110deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 18px; font-size: 34px; font-weight: 800;
    box-shadow: 0 16px 44px rgba(0, 91, 255, 0.20);
    text-decoration: none;
  }
  
  .course-banner {
    margin-top: 88px; width: 100%; padding: 32px 28px; text-align: center;
    background: var(--accent-bg); border: 1px solid var(--accent-border);
    border-radius: 22px; color: var(--accent); font-size: 30px; font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>
  <div class="glow bl"></div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#talentstrategy</div>
  </header>

  <section class="cta-body">
    <h2 class="cta-title">
      Build Your<br>
      <span class="accent-grad">A-Team</span> Today
    </h2>
    <p class="cta-sub">Follow for systems-based thinking on creative direction, team building, and lifestyle leverage.</p>
    <a href="#" class="follow-btn">Follow @alohadreamlife</a>
    <div class="course-banner">"Understand the structure — design your life." · Aloha Dream Life</div>
  </section>
</div>
</body>
</html>
