<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Why A-Players Only Work With A-Players</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --bg: #FAFCFF;
    --bg-elevated: #FFFFFF;
    --bg-card: #FFFFFF;

    --text-primary: #111827;
    --text-secondary: #374151;
    --text-tertiary: #6B7280;

    --accent: #005BFF;
    --accent-2: #00D2FF;
    --accent-soft: #005BFF;
    --accent-bg: rgba(0, 91, 255, 0.04);
    --accent-border: rgba(0, 91, 255, 0.12);
    --accent-strong: rgba(0, 91, 255, 0.08);

    --card-border: rgba(0, 91, 255, 0.08);
    --card-border-strong: rgba(0, 91, 255, 0.15);
  }

  .card-header-left .brand-dot {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .card-header-left .label {
    color: var(--text-primary);
  }

  .glow {
    position: absolute;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .glow.tr {
    top: -260px; right: -220px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  }
  .glow.bl {
    bottom: -300px; left: -240px;
    background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
  }

  .cover-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-mark {
    position: absolute; top: -40px; right: -30px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 360px; font-weight: 700; line-height: 0.9;
    letter-spacing: -0.08em; color: var(--accent-bg);
    user-select: none; z-index: 0;
  }
  .cover-badge { align-self: flex-start; margin-bottom: 46px; }
  .cover-title { font-size: 100px; font-weight: 900; line-height: 1.04; letter-spacing: -0.04em; color: var(--text-primary); }
  .cover-sub { font-size: 34px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.4; }
  .cover-meta { display: flex; gap: 14px; align-items: center; margin-top: 54px; font-size: 22px; color: var(--text-tertiary); }
  .cover-meta .dot { color: rgba(0,91,255,0.2); }
  .swipe-hint { margin-top: 50px; font-size: 22px; color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>
  <div class="glow bl"></div>
  <div class="cover-mark">TALENT</div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#talentstrategy</div>
  </header>

  <section class="cover-hero">
    <div class="cover-badge"><span class="badge">STRATEGY</span></div>
    <h1 class="cover-title">
      Why <span class="accent-grad">A-Players</span><br>
      Only Work<br>
      With A-Players
    </h1>
    <p class="cover-sub">Steve Jobs’ formula for recruiting and building insanely great teams.</p>
    <div class="cover-meta">
      <span>Recruiting</span><span class="dot">·</span>
      <span>Leadership</span><span class="dot">·</span>
      <span>Team Dynamics</span>
    </div>
    <div class="swipe-hint">swipe →</div>
  </section>
</div>
</body>
</html>
