<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --bg: #FAF9F6;
    --bg-elevated: #F0EFEA;
    --bg-card: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-tertiary: #8A8A8A;
    --accent: #0052FF;
    --accent-2: #00A3FF;
    --accent-soft: #4D88FF;
    --accent-bg: rgba(0, 82, 255, 0.05);
    --accent-border: rgba(0, 82, 255, 0.20);
    --accent-strong: rgba(0, 82, 255, 0.12);
    --card-border: rgba(0, 0, 0, 0.08);
  }

  /* Specific Cover Layout */
  .cover-card {
    background-image: url('cover-bg.jpg');
    background-size: cover;
    background-position: center;
    position: relative;
    padding: 0; /* Clear default card padding to fit overlay */
  }

  .cover-overlay {
    position: absolute;
    inset: 48px;
    background: rgba(250, 249, 246, 0.90);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 36px;
    padding: 64px 76px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
  }

  .cover-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 2;
  }

  .cover-badge {
    align-self: flex-start;
    margin-bottom: 46px;
  }

  .cover-title {
    font-size: 82px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.035em;
    color: var(--text-primary);
    font-family: 'Poppins', sans-serif;
  }

  .cover-sub {
    font-size: 30px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 34px;
    line-height: 1.45;
    letter-spacing: -0.01em;
  }

  .cover-meta {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 54px;
    font-size: 22px;
    color: var(--text-tertiary);
    font-weight: 600;
  }

  .cover-meta .dot {
    color: rgba(0, 0, 0, 0.15);
  }

  .swipe-hint {
    margin-top: 50px;
    font-size: 22px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card cover-card">
  <div class="cover-overlay">
    <header class="card-header">
      <div class="card-header-left">
        <span class="brand-dot" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));">A</span>
        <span class="label" style="color: var(--text-primary);">Aloha Dream Life</span>
      </div>
      <div class="card-header-right" style="color: var(--text-tertiary);">#AILeverage</div>
    </header>

    <section class="cover-hero">
      <div class="cover-badge"><span class="badge" style="background: var(--accent); color: #fff;">PLAYBOOK</span></div>
      <h1 class="cover-title">
        Make Money<br>
        With Claude:<br>
        <span class="accent-grad">5 Proven Ways</span><br>
        to Start
      </h1>
      <p class="cover-sub">How to bridge the gap between AI capabilities and real, existing market demand in 2026.</p>
      <div class="cover-meta">
        <span>Software Loops</span><span class="dot">·</span>
        <span>Digital Assets</span><span class="dot">·</span>
        <span>Arbitrage</span>
      </div>
      <div class="swipe-hint">swipe →</div>
    </section>
  </div>
</div>
</body>
</html>
