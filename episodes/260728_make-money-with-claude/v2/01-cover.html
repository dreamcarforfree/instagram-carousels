<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --bg: #FAF9F6;
    --bg-elevated: #F0EFEA;
    --bg-card: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-tertiary: #8A8A8A;
    --accent: #0052FF;
    --accent-2: #00A3FF;
    --accent-soft: #4D88FF;
    --accent-bg: rgba(0, 82, 255, 0.05);
    --accent-border: rgba(0, 82, 255, 0.20);
    --accent-strong: rgba(0, 82, 255, 0.12);
    --card-border: rgba(0, 0, 0, 0.08);
  }
</style>
</head>
<body>
<div class="card" style="background-color: #FAF9F6; display: flex; flex-direction: column; justify-content: space-between; padding: 76px 76px 90px; border: 1px solid var(--card-border);">
  <header class="card-header" style="margin-bottom: 40px;">
    <div class="card-header-left">
      <span class="brand-dot" style="background: var(--accent);">A</span>
      <span class="label" style="color: var(--text-primary); font-family: 'Space Grotesk', sans-serif;">Aloha Dream Life</span>
    </div>
    <div class="card-header-right" style="color: var(--text-tertiary);">#AILeverage</div>
  </header>

  <section class="cover-hero" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 38px;">
      <!-- Elegant high-status Claude Code CLI symbol -->
      <svg viewBox="0 0 100 100" width="76" height="76" style="fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M25 35 L45 50 L25 65 M52 65 L75 65" />
      </svg>
      <div class="cover-badge"><span class="badge" style="background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; padding: 8px 18px; border-radius: 30px; letter-spacing: 0.12em;">CLAUDE CODE</span></div>
    </div>

    <h1 class="cover-title" style="font-size: 82px; font-weight: 900; line-height: 1.1; letter-spacing: -0.035em; color: var(--text-primary); font-family: 'Poppins', sans-serif;">
      Make Money<br>
      With Claude:<br>
      <span class="accent-grad" style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">5 Proven Ways</span><br>
      to Start
    </h1>
    <p class="cover-sub" style="font-size: 30px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.45; letter-spacing: -0.01em;">How to bridge the gap between AI capabilities and real, existing market demand in 2026.</p>
    <div class="cover-meta" style="display: flex; gap: 14px; align-items: center; margin-top: 54px; font-size: 22px; color: var(--text-tertiary); font-weight: 600;">
      <span>Software Loops</span><span class="dot" style="color: rgba(0, 0, 0, 0.15);">·</span>
      <span>Digital Assets</span><span class="dot" style="color: rgba(0, 0, 0, 0.15);">·</span>
      <span>Arbitrage</span>
    </div>
    <div class="swipe-hint" style="margin-top: 50px; font-size: 22px; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;">swipe →</div>
  </section>
</div>
</body>
</html>
