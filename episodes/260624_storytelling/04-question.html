<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>04 · Question</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  :root {
    --accent: #FF7A45;
    --accent-2: #FF4D6D;
  }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .quote-container { margin-top: 40px; display: flex; flex-direction: column; gap: 40px; }
  .quote-block {
    padding: 40px 46px; border-radius: 24px; border-left: 8px solid;
    position: relative;
  }
  .quote-block.accent-block {
    border-left-color: var(--accent);
    background: rgba(255, 122, 69, 0.03);
    border-top: 1px solid rgba(255, 122, 69, 0.08);
    border-right: 1px solid rgba(255, 122, 69, 0.08);
    border-bottom: 1px solid rgba(255, 122, 69, 0.08);
  }
  .quote-block:not(.accent-block) {
    border-left-color: var(--text-tertiary);
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    border-right: 1px solid rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  .quote-label {
    font-size: 20px; font-weight: 800; letter-spacing: 0.1em;
    margin-bottom: 12px; display: block;
  }
  .quote-block.accent-block .quote-label { color: var(--accent); }
  .quote-block:not(.accent-block) .quote-label { color: var(--text-tertiary); }
  .quote-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px; font-weight: 700; line-height: 1.3;
    letter-spacing: -0.02em; color: var(--text-primary);
  }
  .quote-block.accent-block .quote-text {
    color: var(--text-primary);
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot" style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#BrandStrategy</div>
  </header>

  <section class="card-body">
    <div class="eyebrow">THE SHIFT IN FOCUS</div>
    <h2 class="title-xl">
      One question<br>
      defines your <span class="accent-grad">growth.</span>
    </h2>

    <div class="quote-container">
      <!-- Telling Stories Box -->
      <div class="quote-block">
        <span class="quote-label">TELLING STORIES ASKS:</span>
        <div class="quote-text">
          &ldquo;What do I post today?&rdquo;
        </div>
      </div>

      <!-- Storytelling Box -->
      <div class="quote-block accent-block">
        <span class="quote-label">STORYTELLING ASKS:</span>
        <div class="quote-text" style="color: var(--accent-soft);">
          &ldquo;How does this help them?&rdquo;
        </div>
      </div>
    </div>

    <div class="bottom-banner">Stop creating content to be seen. Create content to be useful.</div>
  </section>
</div>
</body>
</html>
