<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 · CTA</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  :root {
    --accent: #FF7A45;
    --accent-2: #FF4D6D;
  }
  .cta-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cta-title { font-size: 84px; font-weight: 900; line-height: 1.1; letter-spacing: -0.035em; }
  .cta-sub { font-size: 32px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.5; }
  .follow-btn {
    margin-top: 68px; display: inline-block; padding: 30px 76px;
    background: linear-gradient(110deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 18px; font-size: 34px; font-weight: 800;
    box-shadow: 0 16px 44px rgba(255,77,109,0.30);
    text-decoration: none;
  }
  .course-banner {
    margin-top: 88px; width: 100%; padding: 32px 28px; text-align: center;
    background: var(--accent-bg); border: 1px solid var(--accent-border);
    border-radius: 22px; color: var(--accent-soft); font-size: 30px; font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>
  <div class="glow bl"></div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot" style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#BrandStrategy</div>
  </header>

  <div class="page-number">08</div>

  <section class="cta-body">
    <h2 class="cta-title">
      Ready to build a<br>
      <span class="accent-grad">real brand?</span>
    </h2>
    <p class="cta-sub">Follow for the systems and frameworks<br>to build a wealthy, healthy, happy life.</p>
    <a href="https://instagram.com/alohadreamlife" class="follow-btn" target="_blank">Follow @alohadreamlife</a>
    <div class="course-banner">Vision without action is a daydream. Start storytelling today.</div>
  </section>
</div>
</body>
</html>
