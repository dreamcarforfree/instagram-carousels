<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 · Cover</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  :root {
    --accent: #FF7A45;
    --accent-2: #FF4D6D;
  }
  .cover-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-mark {
    position: absolute; top: -40px; right: -30px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 360px; font-weight: 700; line-height: 0.9;
    letter-spacing: -0.08em; color: var(--accent-bg);
    user-select: none; z-index: 0;
  }
  .cover-badge { align-self: flex-start; margin-bottom: 46px; }
  .cover-title { font-size: 96px; font-weight: 900; line-height: 1.05; letter-spacing: -0.04em; }
  .cover-sub { font-size: 34px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.4; }
  .cover-meta { display: flex; gap: 14px; align-items: center; margin-top: 54px; font-size: 22px; color: var(--text-tertiary); }
  .cover-meta .dot { color: rgba(255,122,69,0.2); }
  .swipe-hint { margin-top: 50px; font-size: 22px; color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>
  <div class="glow bl"></div>
  <div class="cover-mark">BRAND</div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot" style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#BrandStrategy</div>
  </header>

  <div class="page-number">01</div>

  <section class="cover-hero">
    <div class="cover-badge"><span class="badge">PLAYBOOK</span></div>
    <h1 class="cover-title">
      Storytelling<br>
      <span class="accent-grad">vs.</span><br>
      Telling Stories
    </h1>
    <p class="cover-sub">Are you building a real brand, or are you just a wannabe? The difference is purpose.</p>
    <div class="cover-meta">
      <span>Brand Strategy</span><span class="dot">·</span>
      <span>Marketing</span><span class="dot">·</span>
      <span>Audience Growth</span>
    </div>
    <div class="swipe-hint">swipe →</div>
  </section>
</div>
</body>
</html>
