<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1350"><title>PRINCIPLE 05</title><link rel="stylesheet" href="../../../styles/carousel.css"><link rel="stylesheet" href="theme.css"></head><body><main class="card principle"><section class="content"><div class="body-wrap"><div class="eyebrow">PRINCIPLE 05</div><h1 class="title">YŪGEN</h1><div class="kicker">Showing less can become more powerful</div><div class="body">Yūgen (幽玄) creates pull through what is withheld.<br><br>It does not explain every layer.<br><br>It gives the viewer just enough<br>to complete the image mentally.<br><br>Low-status design over-explains.<br><br>High-status design leaves room for discovery.</div></div></section></main></body></html>
