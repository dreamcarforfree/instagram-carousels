<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>12 CTA</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<link rel="stylesheet" href="theme.css">
<style>
  .cta-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .cta-title {
    font-size: 80px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.035em;
    color: var(--text-primary);
  }
  .cta-sub {
    font-size: 30px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 34px;
    line-height: 1.5;
  }
  .follow-btn {
    margin-top: 68px;
    display: inline-block;
    padding: 26px 76px;
    background: var(--accent) !important;
    color: #fff !important;
    border-radius: 18px;
    font-size: 32px;
    font-weight: 800;
    box-shadow: 0 16px 44px rgba(0, 51, 255, 0.2) !important;
    text-decoration: none;
  }
  .course-banner {
    margin-top: 88px;
    width: 100%;
    padding: 32px 28px;
    text-align: center;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 22px;
    color: var(--accent);
    font-size: 28px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr" style="opacity: 0.12;"></div>
  <div class="glow bl" style="opacity: 0.12;"></div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label" style="color: #111111;">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#VisualSystem</div>
  </header>

  <section class="cta-body">
    <h2 class="cta-title">
      Understand the <span class="accent">Structure.</span><br>
      Design Your Life.
    </h2>
    <p class="cta-sub">Save this blueprint to anchor your standards.<br>Follow for more systems on Wealth, Health, and Happiness.</p>
    <a href="https://alohadreamlife.com" class="follow-btn">Follow @alohadreamlife</a>
    <div class="course-banner">alohadreamlife.com</div>
  </section>
</div>
</body>
</html>
