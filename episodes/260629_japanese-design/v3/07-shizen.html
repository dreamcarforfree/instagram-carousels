<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1350"><title>PRINCIPLE 04</title><link rel="stylesheet" href="../../../styles/carousel.css"><link rel="stylesheet" href="theme.css"></head><body><main class="card principle"><div class="image-zone"></div><section class="content"><div class="body-wrap"><div class="eyebrow">PRINCIPLE 04</div><h1 class="title">SHIZEN</h1><div class="kicker">The highest skill feels invisible</div><div class="body">Shizen (自然) makes effort disappear.<br><br>The viewer should feel nature,<br>not construction.<br><br>Texture, spacing, color, and rhythm<br>should feel inevitable before they feel designed.<br>When the effort becomes too visible,<br>the design loses authority.</div></div></section></main></body></html>
