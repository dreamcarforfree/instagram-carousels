<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  :root {
    --accent: #FFE054;
    --accent-2: #FFF59D;
    --text-primary: #FFFFFF;
    --text-secondary: #E2E8F0;
    --text-tertiary: #94A3B8;
  }
  .card {
    background-image: linear-gradient(135deg, rgba(26, 73, 216, 0.93) 0%, rgba(15, 23, 42, 0.97) 100%), url('cover_bg.jpg');
    background-size: cover;
    background-position: center;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 84px 84px;
    font-family: 'Poppins', 'Inter', sans-serif;
  }
  .brand-logo-text {
    font-size: 26px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }
  .title-cover {
    font-family: 'Poppins', sans-serif;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    color: #FFFFFF;
  }
  .subtitle-cover {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.4;
    color: #FFE054;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 24px;">
    <div class="card-header-left" style="display: flex; align-items: center; gap: 14px;">
      <img src="logo.png" style="height: 38px; width: auto;" alt="Aloha Dream Life Logo">
      <span class="brand-logo-text">AlohaDreamLife.com</span>
    </div>
    <div class="card-header-right" style="color: rgba(255,255,255,0.6); font-weight: 700; font-size: 22px;">#RealEstate</div>
  </header>

  <div class="page-number" style="color: rgba(255,255,255,0.4); top: 132px; right: 84px;">01/10</div>

  <div class="card-body" style="padding-top: 0; justify-content: center; flex: 1;">
    <h1 class="title-cover">
      6 Things You Should Never Say to Your Real Estate Agent When Buying a Home
    </h1>
    <p class="subtitle-cover">
      Learn What to Say Instead
    </p>
  </div>

  <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 40px; margin-top: auto;">
    <span style="font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.6);">AlohaDreamLife.com</span>
    <span style="font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.4);">Slide 01/10</span>
  </div>
</div>
</body>
</html>
