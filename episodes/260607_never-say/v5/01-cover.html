<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --accent: #FFE054;
    --accent-2: #FFF59D;
    --text-primary: #FFFFFF;
    --text-secondary: #E2E8F0;
    --text-tertiary: #94A3B8;
  }
  .card {
    background-image: linear-gradient(135deg, rgba(26, 73, 216, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%), url('cover_bg.jpg');
    background-size: cover;
    background-position: center;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 84px 84px;
  }
  .brand-logo-text {
    font-size: 26px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }
  .title-cover {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 82px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.04em;
    margin-top: 40px;
  }
  .subtitle-cover {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.45;
    color: #E2E8F0;
    margin-top: 32px;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left" style="display: flex; align-items: center; gap: 14px;">
      <span class="brand-logo-text">AlohaDreamLife.com</span>
    </div>
  </header>

  <div class="page-number" style="color: rgba(255,255,255,0.4);">01</div>

  <div class="card-body" style="padding-top: 0; justify-content: center; flex: 1;">
    <div style="display: inline-block; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 999px; font-size: 22px; font-weight: 700; letter-spacing: 0.05em; color: #FFE054; margin-bottom: 24px;">
      #RealEstateTips
    </div>
    <h1 class="title-cover">6 Things You Should <span style="color: #FFE054; text-shadow: 0 4px 24px rgba(255,224,84,0.35);">NEVER Say</span> to Your Real Estate Agent</h1>
    <p class="subtitle-cover">Learn What to Say Instead</p>
  </div>
</div>
</body>
</html>
