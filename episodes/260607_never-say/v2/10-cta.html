<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>10 Call To Action</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  :root {
    --bg: #FFFFFF;
    --bg-elevated: #F8FAFC;
    --bg-card: #F8FAFC;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-tertiary: #94A3B8;
    --accent: #1A49D8;
    --accent-2: #3B82F6;
    --accent-soft: #2563EB;
    --accent-bg: rgba(26, 73, 216, 0.04);
    --accent-border: rgba(26, 73, 216, 0.12);
    --accent-strong: rgba(26, 73, 216, 0.08);

    --card-border: #E2E8F0;
  }
  body {
    background: #FFFFFF;
    color: #0F172A;
    font-family: 'Poppins', 'Inter', sans-serif;
  }
  .card {
    background: #FFFFFF;
    border: 1.5px solid #F1F5F9;
    padding: 76px 84px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    width: 1080px;
    height: 1350px;
  }
  .cta-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    max-width: 840px;
    margin-top: 40px;
  }
  .cta-title {
    font-family: 'Poppins', sans-serif;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.03em;
    color: #0F172A;
    margin-bottom: 24px;
  }
  .cta-subtitle {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text-secondary);
    margin-bottom: 48px;
  }
  .action-buttons {
    display: flex;
    gap: 24px;
    margin-top: 20px;
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 36px;
    border-radius: 999px;
    font-size: 24px;
    font-weight: 700;
    border: 1.5px solid var(--card-border);
    background: var(--bg-card);
    color: #334155;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(15, 23, 42, 0.01);
  }
  .action-btn-primary {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1.5px solid #F1F5F9;
    padding-top: 24px;
    width: 100%;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    height: 38px;
    width: auto;
  }
  .brand-name {
    font-size: 24px;
    font-weight: 800;
    color: #0F172A;
    letter-spacing: -0.01em;
  }
  .footer-right {
    font-size: 24px;
    font-weight: 700;
    color: #94A3B8;
    font-family: 'Space Grotesk', sans-serif;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header" style="border-bottom: 1.5px solid #F1F5F9; padding-bottom: 20px; width: 100%;">
    <div class="card-header-left" style="display: flex; align-items: center; gap: 14px;">
      <img src="logo.png" style="height: 38px; width: auto;" alt="Aloha Dream Life Logo">
      <span class="brand-name">AlohaDreamLife.com</span>
    </div>
    <div class="card-header-right" style="color: var(--text-tertiary); font-weight: 700; font-size: 22px;">#AlohaDreamLife</div>
  </header>

  <div class="page-number" style="top: 132px; right: 84px;">10/10</div>

  <div class="cta-content">
    <div style="display: flex; justify-content: center; margin-bottom: 32px;">
      <img src="logo.png" style="height: 120px; width: auto;" alt="Aloha Dream Life Logo">
    </div>

    <h2 class="cta-title">
      Ready to find your<br>
      <span style="color: var(--accent);">dream life in paradise?</span>
    </h2>
    
    <p class="cta-subtitle">
      Visit <strong>AlohaDreamLife.com</strong> for expert real estate strategies, detailed neighborhood guides, and premium Hawaiian lifestyle inspiration.
    </p>

    <div class="action-buttons">
      <div class="action-btn action-btn-primary">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Subscribe Free
      </div>
      <div class="action-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        Follow Us
      </div>
    </div>
  </div>

  <footer class="card-footer">
    <div class="footer-left">
      <img src="logo.png" class="brand-logo" alt="Aloha Dream Life Logo">
      <span class="brand-name">AlohaDreamLife.com</span>
    </div>
    <div class="footer-right">10/10</div>
  </footer>
</div>
</body>
</html>
