<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover - Translucent Web Background</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<link rel="stylesheet" href="theme.css">
<style>
  .card {
    background-image: url('assets/nvidia_free_models_bg_5.png');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="assets/logo.png" alt="Logo" style="height: 38px; width: auto; object-fit: contain;">
      <span class="label" style="color: #111111; font-weight: 700; font-family: 'Space Grotesk', sans-serif;">Aloha Dream Life</span>
    </div>
    <div class="card-header-right" style="color: var(--text-secondary);">#AIOperations</div>
  </header>

  <section class="cover-hero">
    <div class="cover-badge"><span class="badge" style="background: var(--accent); color: #FFFFFF; font-weight: 800; font-family: 'Space Grotesk', sans-serif; padding: 10px 20px; border-radius: 8px;">MODULAR INTELLIGENCE</span></div>
    <h1 class="cover-title" style="margin-top: 20px; font-size: 84px; line-height: 1.1; font-weight: 900; letter-spacing: -0.04em;">
      100+ Free Models:<br>
      How to Run<br>
      Your AI Stack<br>
      <span class="accent">For $0/Month</span>
    </h1>
    <p style="font-size: 28px; color: var(--text-secondary); margin-top: 30px; font-weight: 500; line-height: 1.4; max-width: 800px;">
      Replace your costly ChatGPT and Claude API subscriptions with enterprise-grade alternatives.
    </p>
    <div class="swipe-hint">swipe →</div>
  </section>
</div>
</body>
</html>
