<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 CTA · Terminal</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<link rel="stylesheet" href="theme.css">
<style>
  .cta-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cta-title { font-size: 86px; font-weight: 900; line-height: 1.08; letter-spacing: -0.035em; color: var(--text-primary); }
  .cta-sub { font-family:'JetBrains Mono',monospace; font-size: 28px; font-weight: 400; color: var(--text-tertiary); margin-top: 34px; line-height: 1.5; max-width: 800px; }
  .follow-btn { margin-top: 64px; display: inline-block; padding: 30px 78px; font-size: 34px; font-weight: 700; }
  .course-banner { margin-top: 80px; width: 100%; padding: 34px 30px; text-align: center; background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent-soft); font-size: 29px; font-weight: 700; line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#personalbrand</div>
  </header>

  <div class="page-number">08</div>

  <section class="cta-body">
    <h2 class="cta-title">
      <span class="accent">Save this</span><br>
      and start today
    </h2>
    <p class="cta-sub">// pick one format · commit 90 days · let compounding take over</p>
    <span class="follow-btn">Follow @alohadreamlife</span>
    <div class="course-banner">"Vision without action is a daydream. Action without vision is a nightmare." 🚀</div>
  </section>
</div>
</body>
</html>
