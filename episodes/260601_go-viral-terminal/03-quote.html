<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>03 Quote · Terminal</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<link rel="stylesheet" href="theme.css">
<style>
  .q-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 80px; }
  .quote-block {
    border-left: 4px solid var(--accent);
    background: var(--accent-bg);
    border-radius: 0 10px 10px 0;
    padding: 48px 52px;
  }
  .quote-block p { font-size: 52px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em; color: var(--text-primary); font-style: italic; }
  .quote-block .attr { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: var(--accent); margin-top: 30px; }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#personalbrand</div>
  </header>

  <div class="page-number">03</div>

  <section class="q-body">
    <div class="eyebrow">Why #1 · The Game</div>
    <div class="quote-block">
      <p>"Prove you can hold attention, and I will distribute you."</p>
      <div class="attr">— the contract every platform offers</div>
    </div>
  </section>

  <div class="bottom-banner">The algorithm is indifferent to follower count. It responds to performance signals.</div>
</div>
</body>
</html>
