<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  :root {
    --accent: #0052FF;
    --accent-soft: rgba(0, 82, 255, 0.1);
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #FAFAFC;
    font-family: 'Inter', sans-serif;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
  }
  .card {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #FAFAFC;
  }
  .card-header {
    position: absolute;
    top: 54px;
    left: 76px;
    right: 76px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    height: 44px;
    width: auto;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }
  .bottom-header .brand-name {
    color: #0F172A;
  }
  .tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .horizon {
    position: absolute;
    top: 675px;
    left: 0;
    width: 1080px;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 82, 255, 0.15) 15%, #0052FF 50%, rgba(0, 82, 255, 0.15) 85%, transparent 100%);
    z-index: 50;
  }
  .horizon::after {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #0052FF;
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(0, 82, 255, 0.12);
  }
  .half {
    position: absolute;
    left: 0;
    width: 1080px;
    height: 675px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 130px 76px 60px;
  }
  .top {
    top: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 100%), url('cover_bg.jpg') center/cover no-repeat;
  }
  .bottom {
    top: 675px;
    background: #FFFFFF;
    padding-top: 60px;
    padding-bottom: 130px;
  }
  .eyebrow-mini {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 88px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.05em;
    color: #FFFFFF;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .hero-title .vs {
    font-size: 34px;
    color: #0052FF;
    text-shadow: none;
    margin: 10px 0;
    display: block;
    text-transform: lowercase;
  }
  .cover-question {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 68px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.04em;
    color: #0F172A;
  }
  .cover-question .blue {
    color: #0052FF;
  }
  .footer {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #94A3B8;
    letter-spacing: 0.05em;
    z-index: 100;
  }
  .page-number {
    position: absolute;
    bottom: 40px;
    right: 76px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #94A3B8;
    z-index: 100;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="brand-lockup">
      <img src="assets/adl-logo.svg" class="brand-logo" alt="ADL Logo">
      <span class="brand-name">Aloha Dream Life</span>
    </div>
    <div class="tag">#G7GOLDMINE</div>
  </header>
  
  <div class="horizon"></div>

  <section class="half top">
    <div class="eyebrow-mini">G7 Goldmine</div>
    <h1 class="hero-title">Storytelling<br><span class="vs">vs.</span>Telling Stories</h1>
  </section>
  
  <section class="half bottom">
    <div class="cover-question">Are You a <span class="blue">Brand</span><br>or a Wannabe?</div>
  </section>

  <div class="footer">@alohadreamlife</div>
  <div class="page-number">01</div>
</div>
</body>
</html>
