<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>07 Math · The generalist principle</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  .mt-title { margin-bottom: 44px; }
  .math-row {
    display: flex; align-items: center; gap: 28px;
    padding: 34px 38px; border-radius: 22px; border: 1px solid var(--card-border);
    background: var(--bg-card);
  }
  .math-row + .math-row { margin-top: 22px; }
  .math-row.win { background: var(--accent-bg); border-color: var(--accent-border); }
  .math-row .figure {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 64px; letter-spacing: -0.04em; line-height: 1;
    color: var(--text-primary); flex-shrink: 0; min-width: 300px;
  }
  .math-row.win .figure { color: var(--accent); }
  .math-row .detail { font-size: 26px; font-weight: 600; color: var(--text-secondary); line-height: 1.36; }
  .math-row .detail b { color: #ECECF0; font-weight: 800; }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#personalbrand</div>
  </header>

  <div class="page-number">07</div>

  <section class="card-body">
    <div class="eyebrow">Why #5 · The Generalist Principle</div>
    <h2 class="title-xl mt-title">
      The math that<br>
      <span class="accent">changes everything</span>
    </h2>

    <div class="math-row">
      <div class="figure">5,000</div>
      <div class="detail">10K views, <b>50% core audience</b> — the niche feedback loop.</div>
    </div>
    <div class="math-row win">
      <div class="figure">20,000</div>
      <div class="detail">100K views, <b>20% core audience</b> — broad entry point wins.</div>
    </div>

    <div class="bottom-banner">10% of a million beats 50% of ten thousand. Every time.</div>
  </section>
</div>
</body>
</html>
