<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover · Go Viral On Purpose</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  .cover-mark {
    position: absolute; bottom: -30px; right: -30px; z-index: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 280px; font-weight: 700; line-height: 0.9;
    letter-spacing: -0.08em;
    color: rgba(255, 122, 69, 0.06);
    user-select: none; pointer-events: none;
  }
  .card-body { padding-top: 60px; }
  .cover-badge { margin-bottom: 44px; }
  .cover-title { font-size: 116px; font-weight: 900; line-height: 1.0; letter-spacing: -0.045em; }
  .cover-sub { font-size: 33px; font-weight: 500; color: var(--text-secondary); margin-top: 36px; line-height: 1.42; max-width: 820px; }
  .cover-meta { display: flex; gap: 14px; align-items: center; margin-top: 50px; font-size: 23px; color: var(--text-tertiary); font-weight: 600; }
  .cover-meta .dot { color: rgba(255,255,255,0.18); }
  .swipe-hint { margin-top: 44px; font-size: 22px; color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="card">
  <div class="glow tr"></div>
  <div class="glow bl"></div>
  <div class="cover-mark">VIRAL</div>

  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#personalbrand</div>
  </header>

  <div class="page-number">01</div>

  <section class="card-body">
    <div class="cover-badge"><span class="badge">THE PLAYBOOK</span></div>
    <h1 class="cover-title">
      Go Viral<br>
      <span class="accent-grad">On Purpose</span>
    </h1>
    <p class="cover-sub">Going viral isn't random. It's format, psychology, and distribution — 8 "Whys" that move you from guessing to building intentionally.</p>
    <div class="cover-meta">
      <span>Format</span><span class="dot">·</span>
      <span>Psychology</span><span class="dot">·</span>
      <span>Distribution</span>
    </div>
    <div class="swipe-hint">swipe →</div>
  </section>
</div>
</body>
</html>
