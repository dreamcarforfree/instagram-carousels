<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>12 · CTA</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
:root {
  --bg: #FFFFFF;
  --bg-elevated: #F4F8FF;
  --bg-card: #EEF3FF;
  --text-primary: #0A0F1E;
  --text-secondary: #4B5675;
  --text-tertiary: #8A93A8;
  --accent: #005BFF;
  --accent-2: #0080FF;
  --accent-soft: #3399FF;
  --accent-bg: rgba(0, 91, 255, 0.08);
  --accent-border: rgba(0, 91, 255, 0.22);
  --accent-strong: rgba(0, 91, 255, 0.14);
  --card-border: rgba(0, 0, 0, 0.07);
  --card-border-strong: rgba(0, 0, 0, 0.13);
}

.card {
  align-items: center;
  justify-content: space-between;
  text-align: center;
}

.card-body {
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.final-quote {
  font-size: 42px;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-top: 10px;
}

.url-box {
  margin-top: 50px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  padding: 24px 44px;
  border-radius: 16px;
  font-size: 34px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.01em;
}

.quote-mirae {
  margin-top: 60px;
  font-size: 26px;
  font-weight: 600;
  font-style: italic;
  color: var(--text-tertiary);
  padding: 0 40px;
}
</style>
</head>
<body>
<div class="card">
  <div class="glow bl"></div>

  <header class="card-header" style="width: 100%;">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#MemoryScience</div>
  </header>

  <section class="card-body">
    <div class="eyebrow" style="color:#005BFF">THE VERDICT</div>
    
    <p class="final-quote">
      Learning is a biological system.
    </p>

    <p class="subtitle" style="margin-top: 24px; font-size: 26px; color: var(--text-secondary); width: 85%;">
      If you align your study habits with your brain's biology, everything you learn begins to compound.
    </p>

    <div class="url-box">
      AlohaDreamLife.com
    </div>

    <p class="quote-mirae">
      "The brain does not learn from what it receives. It learns from what it retrieves."
    </p>
  </section>
  
  <div></div> <!-- spacer to push content up perfectly -->
</div>
</body>
</html>
