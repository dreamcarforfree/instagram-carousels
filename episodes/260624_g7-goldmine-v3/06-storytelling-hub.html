<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>06 Storytelling Hub</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap');
  :root { --accent:#0052FF; --bg:#F8FAFC; --text-primary:#0F172A; --text-secondary:#475569; --text-tertiary:#94A3B8; }
  html,body{width:1080px;height:1350px;margin:0;padding:0;background:#F8FAFC;font-family:'Inter',sans-serif;overflow:hidden;}
  .card{width:1080px;height:1350px;position:relative;background:#F8FAFC;overflow:hidden;box-sizing:border-box;}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#F8FAFC 0%,#F1F5F9 100%);z-index:0;}
  .card-header{position:absolute;top:56px;left:80px;right:80px;z-index:10;display:flex;justify-content:space-between;align-items:center;}
  .brand-lockup{display:flex;align-items:center;gap:16px;}
  .brand-logo{height:48px;width:auto;}
  .brand-name{font-size:24px;font-weight:800;color:#0F172A;letter-spacing:-0.02em;}
  .tag{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.12em;}
  .hub-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:920px;height:920px;z-index:2;}
  .center-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;height:260px;background:#0052FF;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,82,255,0.25);}
  .center-hub span{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;color:#FFFFFF;text-align:center;line-height:1.2;letter-spacing:0.08em;text-transform:uppercase;}
  .spoke{position:absolute;top:50%;left:50%;width:460px;height:4px;background:linear-gradient(90deg,#0052FF 0%,rgba(0,82,255,0.2) 100%);transform-origin:0 50%;}
  .spoke:nth-child(2){transform:translateY(-50%) rotate(0deg);}
  .spoke:nth-child(3){transform:translateY(-50%) rotate(90deg);}
  .spoke:nth-child(4){transform:translateY(-50%) rotate(180deg);}
  .spoke:nth-child(5){transform:translateY(-50%) rotate(270deg);}
  .satellite{position:absolute;width:260px;height:260px;border:4px solid #0052FF;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:28px;box-shadow:0 12px 36px rgba(0,34,84,0.08);box-sizing:border-box;}
  .satellite span{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;line-height:1.25;color:#0F172A;text-align:center;}
  .satellite.top{top:0;left:50%;transform:translateX(-50%);}
  .satellite.right{top:50%;right:0;transform:translateY(-50%);}
  .satellite.bottom{bottom:0;left:50%;transform:translateX(-50%);}
  .satellite.left{top:50%;left:0;transform:translateY(-50%);}
  .footer{position:absolute;bottom:48px;left:0;right:0;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#94A3B8;letter-spacing:0.1em;text-transform:uppercase;z-index:10;}
  .page-number{position:absolute;top:56px;right:80px;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#94A3B8;z-index:10;}
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="brand-lockup"><img src="assets/logo.png" class="brand-logo" alt="Logo"><span class="brand-name">Aloha Dream Life</span></div>
    <div class="tag">#G7GOLDMINE</div>
  </header>
  <div class="page-number">06</div>
  <div class="hub-wrap">
    <div class="center-hub"><span>Story<br>telling</span></div>
    <div class="spoke"></div><div class="spoke"></div><div class="spoke"></div><div class="spoke"></div>
    <div class="satellite top"><span>Gives them the lesson they need</span></div>
    <div class="satellite right"><span>Builds trust, connection, and authority</span></div>
    <div class="satellite bottom"><span>“This happened to me so it doesn’t have to happen to you.”</span></div>
    <div class="satellite left"><span>Gets people to buy</span></div>
  </div>
  <div class="footer">@alohadreamlife</div>
</div>
</body>
</html>
