<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --bg: #FFFFFF;
    --bg-elevated: #F8FAFC;
    --bg-card: #F1F5F9;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-tertiary: #94A3B8;
    --accent: #1A49D8;
    --accent-2: #2563EB;
    --accent-soft: #1A49D8;
    --accent-bg: rgba(26, 73, 216, 0.05);
    --accent-border: rgba(26, 73, 216, 0.15);
    --accent-strong: rgba(26, 73, 216, 0.10);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-border-strong: rgba(15, 23, 42, 0.15);
  }

  html, body, .card, .page-number, .eyebrow, .brand-dot, .brand-label, .num, .t1, .big {
    font-family: 'Poppins', 'Inter', sans-serif !important;
  }

  .title-xxl, .title-xl, .title-lg, .title-md, .cover-title, .cta-title {
    font-family: 'Poppins', sans-serif !important;
    font-weight: 300 !important; /* Extra Light */
    letter-spacing: -0.01em !important;
  }

  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.95) 70%, #FFFFFF 100%), url('home_cover_v2.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
  }

  .card-header-left .brand-dot {
    background: var(--accent) !important;
    color: #FFFFFF !important;
  }
  .card-header-left .label {
    color: var(--text-primary) !important;
    font-weight: 700 !important;
  }
  .card-header-right {
    color: var(--text-secondary) !important;
    font-weight: 600 !important;
  }
  .page-number {
    color: var(--text-secondary) !important;
    font-weight: 700 !important;
  }

  .cover-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-badge { align-self: flex-start; margin-bottom: 46px; }
  .cover-title { font-size: 88px; line-height: 1.1; color: var(--text-primary); }
  .cover-sub { font-size: 34px; font-weight: 500; color: var(--text-secondary); margin-top: 34px; line-height: 1.45; }
  .cover-meta { display: flex; gap: 14px; align-items: center; margin-top: 54px; font-size: 22px; color: var(--text-tertiary); font-weight: 600; }
  .cover-meta .dot { color: rgba(15, 23, 42, 0.15); }
  .swipe-hint { margin-top: 50px; font-size: 24px; color: var(--accent); font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#realestate</div>
  </header>

  <div class="page-number">01</div>

  <section class="cover-hero">
    <div class="cover-badge"><span class="badge">GUIDE</span></div>
    <h1 class="cover-title">
      <span class="accent" style="font-weight: 700;">10 Things</span><br>
      You Must Know<br>
      Before Buying a Home
    </h1>
    <p class="cover-sub">Practical steps to help you prepare for one of the biggest purchases of your life.</p>
    <div class="cover-meta">
      <span>Planning</span><span class="dot">·</span>
      <span>Finance</span><span class="dot">·</span>
      <span>Safety</span>
    </div>
    <div class="swipe-hint">Swipe to start planning →</div>
  </section>
</div>
</body>
</html>
