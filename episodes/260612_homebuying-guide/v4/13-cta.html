<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>13 CTA</title>
<link rel="stylesheet" href="../../../styles/carousel.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --bg: #FFFFFF;
    --bg-elevated: #F8FAFC;
    --bg-card: #F1F5F9;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-tertiary: #94A3B8;
    --accent: #1A49D8;
    --accent-2: #2563EB;
    --accent-soft: #1A49D8;
    --accent-bg: rgba(26, 73, 216, 0.05);
    --accent-border: rgba(26, 73, 216, 0.15);
    --accent-strong: rgba(26, 73, 216, 0.10);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-border-strong: rgba(15, 23, 42, 0.15);
  }

  html, body, .card, .page-number, .eyebrow, .brand-dot, .brand-label, .num, .t1, .big {
    font-family: 'Poppins', 'Inter', sans-serif !important;
  }

  .title-xxl, .title-xl, .title-lg, .title-md, .cover-title, .cta-title {
    font-family: 'Poppins', sans-serif !important;
    font-weight: 300 !important; /* Extra Light */
    letter-spacing: -0.01em !important;
  }

  .card-header-left .brand-dot {
    background: var(--accent) !important;
    color: #FFFFFF !important;
  }
  .card-header-left .label {
    color: var(--text-primary) !important;
    font-weight: 700 !important;
  }
  .card-header-right {
    color: var(--text-secondary) !important;
    font-weight: 600 !important;
  }
  .page-number {
    color: var(--text-secondary) !important;
    font-weight: 700 !important;
  }

  .cta-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cta-title { font-size: 78px; line-height: 1.1; color: var(--text-primary); }
  .cta-sub { font-size: 31px; font-weight: 500; color: var(--text-secondary); margin-top: 30px; line-height: 1.45; }
  
  .follow-btn {
    margin-top: 60px; display: inline-block; padding: 28px 72px;
    background: linear-gradient(110deg, var(--accent), var(--accent-2)) !important;
    color: #ffffff !important; border-radius: 18px; font-size: 32px; font-weight: 800;
    box-shadow: 0 16px 44px rgba(26, 73, 216, 0.25) !important;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
  }
  
  .course-banner {
    margin-top: 70px; width: 100%; padding: 30px 24px; text-align: center;
    background: var(--accent-bg) !important; border: 1px solid var(--accent-border) !important;
    border-radius: 22px; color: var(--accent) !important; font-size: 28px; font-weight: 700;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#realestate</div>
  </header>

  <div class="page-number">13</div>

  <section class="cta-body">
    <h2 class="cta-title">
      Ready to<br>
      <span class="accent" style="font-weight: 700;">Take the Next Step</span>?
    </h2>
    <p class="cta-sub">Aloha Dream Life is here to guide you toward<br>homeownership success with genuine care.</p>
    <a href="https://instagram.com/alohadreamlife" class="follow-btn">DM "HOME" to @alohadreamlife</a>
    <div class="course-banner">Read the full comprehensive guide at:<br>alohadreamlife.com/10-things-you-must-know-before-buying-a-home/</div>
  </section>
</div>
</body>
</html>
