<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>04 Reclaiming Cognitive Space</title>
<link rel="stylesheet" href="../../styles/carousel.css">
<style>
  
:root {
  --bg: #FFFFFF;
  --bg-elevated: #F8FAFC;
  --bg-card: #FFFFFF;
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-tertiary: #94A3B8;
  --accent: #0052FF;
  --accent-2: #00C2FF;
  --accent-soft: #2563EB;
  --accent-bg: rgba(0, 82, 255, 0.04);
  --accent-border: rgba(0, 82, 255, 0.12);
  --accent-strong: rgba(0, 82, 255, 0.08);
  --card-border: rgba(0, 0, 0, 0.05);
  --card-border-strong: rgba(0, 0, 0, 0.10);
}
.brand-dot {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
}
.card-header-left .label {
  color: var(--text-primary) !important;
}

  .q-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <span class="brand-dot">A</span>
      <span class="label">Aloha Dream Life</span>
    </div>
    <div class="card-header-right">#CognitiveLeap</div>
  </header>

  <section class="q-body">
    <div class="eyebrow">The Realization</div>
    <div class="quote" style="color: var(--text-primary);">
      <span class="mark">&ldquo;</span>
      Anything you currently type, search, copy, paste, or try to remember—your <span class="accent-grad">agent can execute</span> for you.
    </div>
    <div class="quote-attr" style="color: var(--text-secondary);">— delegating the friction of daily memory</div>
  </section>

  <div class="bottom-banner">Clear your administrative backlog and free up your mental bandwidth.</div>
</div>
</body>
</html>
